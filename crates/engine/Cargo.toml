[package]
name = "papel-engine"
description = "Papel engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
papel-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
papel-render = { workspace = true }
papel-cos = { workspace = true }
papel-organize = { workspace = true }
papel-annot = { workspace = true }
papel-forms = { workspace = true }
papel-xfa = { workspace = true }
papel-edit = { workspace = true }
papel-content = { workspace = true }
papel-audit = { workspace = true }
papel-redact = { workspace = true }
papel-print = { workspace = true }
papel-xfdf = { workspace = true }
papel-sign = { workspace = true }
papel-optimize = { workspace = true }
papel-a11y = { workspace = true }
papel-ocr = { workspace = true }
papel-js = { workspace = true }
papel-compare = { workspace = true }
papel-preflight = { workspace = true }
papel-export = { workspace = true }
papel-fonts = { workspace = true }
papel-create = { workspace = true }
papel-model = { workspace = true }
papel-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and papel-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
papel-testkit = { workspace = true }
# JBIG2 fixtures (`encode_jbig2_generic`).
papel-filters = { workspace = true }
