[package]
name = "papel-web"
description = "Papel in the browser (wasm32; build with `trunk build --release` in this directory)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
papel-ui-egui = { workspace = true }
# The host messages (getnodalia/foundation (vendor/nodalia-libs)): one contract and one bridge for the web builds.
# The page command API (storytold/craft-libs#413): window.papel over the UI control channel.
nodalia-web-api = { git = "https://github.com/getnodalia/foundation", rev = "a5ba368c1313d208fe927b5bbdf06bddf38b1b2f", version = "0.1.0" }
nodalia-web-host = { git = "https://github.com/getnodalia/foundation", rev = "a5ba368c1313d208fe927b5bbdf06bddf38b1b2f", version = "0.1.0" }
eframe = { workspace = true, features = ["default_fonts", "glow", "persistence", "accesskit"] }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Location", "Url", "UrlSearchParams", "Response", "Event", "MessageEvent", "EventTarget", "CustomEvent", "CustomEventInit"] }
js-sys = "0.3"
